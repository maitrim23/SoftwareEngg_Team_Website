<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Sign In — Software Engineering Project</title>
<meta name="description" content="Sign in to the Software Engineering Project team hub.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-bars" aria-hidden="true"><span></span><span></span></span>
      SE Project
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="planning.html" class="nav-link">Planning</a>
      <a href="history.html" class="nav-link auth-only" style="display: none;">History</a>
    </nav>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <a href="auth.html" class="signin-btn">Team sign in</a>
    </div>
  </div>
</header>

<main>

  <section class="auth-section reveal">
    <div class="wrap wrap--narrow">
      <p class="eyebrow">Members only</p>
      <h1 class="hero-title hero-title--small">Team sign in</h1>
      <p class="hero-sub">Sign in with your team account to upload files and manage project materials.</p>

      <!--
        ============================================================
        ✏️  EDIT SIGN-IN BEHAVIOR HERE
        ============================================================
        This is a static front-end form only — it doesn't check
        credentials or talk to a server yet. The JS below just
        prevents the page from reloading and shows a placeholder
        message via showAuthMessage() in script.js.

        To connect this to something real (e.g. your own backend,
        Firebase Auth, Supabase, etc.), replace the submit handler
        in script.js — look for the block marked:

            const authForm = document.getElementById("auth-form");
        ============================================================
      -->
      <form id="auth-form" class="auth-form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" class="field-input" placeholder="you@team.com" required autocomplete="email">
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" name="password" class="field-input" placeholder="••••••••" required autocomplete="current-password">
        </label>

        <button type="submit" class="cta cta--button">Sign in <span class="cta-arrow">→</span></button>

        <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-footnote">Not a team member? <a href="index.html" class="auth-link">Back to home</a></p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-text">Software Engineering Project — internal team record</p>
  </div>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
