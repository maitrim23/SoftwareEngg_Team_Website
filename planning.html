<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Materials — Software Engineering Project</title>
<meta name="description" content="Slides, planning documents and reports for our software engineering project.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-bars" aria-hidden="true"><span></span><span></span></span>
      SE Project
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="planning.html" class="nav-link nav-link--active">Planning</a>
      <a href="history.html" class="nav-link auth-only" style="display: none;">History</a>
    </nav>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <a href="auth.html" class="signin-btn">Team sign in</a>
    </div>
  </div>
</header>

<main>

  <section class="hero hero--planning reveal">
    <div class="wrap">
      <p class="eyebrow">Planning &amp; Presentations</p>
      <h1 class="hero-title">Project Materials</h1>

      <!--
        ============================================================
        ✏️  EDIT THIS PARAGRAPH HERE
        ============================================================
        Updated per request: "Only team members can upload."
        (previously also said "...or open files")
      -->
      <p class="hero-sub">Slides, planning documents and reports. Only team members can upload.</p>

      <button type="button" class="signin-upload-box">Upload a file</button>
    </div>
  </section>

  <div class="wrap"><div class="hr"></div></div>

  <section class="uploads reveal">
    <div class="wrap">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <p class="eyebrow" style="margin-bottom: 0;">Uploaded</p>
        <label class="filter-toggle auth-only" style="display: none;">
          <input type="checkbox" id="filter-my-uploads"> Show only my uploads
        </label>
      </div>
      
      <div class="uploads-grid">
        <!-- Left Side: List of Files -->
        <div class="uploads-list-col">
          <div id="uploads-list"></div>
        </div>

        <!-- Right Side: File Preview Pane -->
        <div class="uploads-preview-col" id="preview-col" style="display: none;">
          <div class="preview-header">
            <h3 id="preview-title" class="preview-title">File Preview</h3>
            <div class="preview-actions">
              <button type="button" id="btn-download" class="preview-btn">Download</button>
              <button type="button" id="btn-delete" class="preview-btn preview-btn--danger auth-only" style="display: none;">Delete</button>
            </div>
          </div>
          <div class="preview-body">
            <iframe id="file-preview" src="" frameborder="0"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Upload a file</h2>
        <button type="button" class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="upload-form" class="auth-form" style="margin-top: 10px;">
        <div class="field">
          <label class="field-label">File</label>
          <input type="file" id="upload-file-input" required class="field-input" style="padding: 6px;" />
        </div>
        
        <div class="field">
          <label class="field-label">Category</label>
          <select id="upload-category" class="field-input" required>
            <option value="presentation">Presentation</option>
            <option value="planning">Planning</option>
            <option value="report">Report</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field" id="custom-category-group" style="display: none;">
          <label class="field-label">Custom Category Name</label>
          <input type="text" id="upload-custom-category" class="field-input" placeholder="e.g. Design Assets" />
        </div>

        <div class="field">
          <label class="field-label">Commit Message</label>
          <input type="text" id="upload-commit" class="field-input" placeholder="e.g. Added latest slides" required />
        </div>

        <div class="field">
          <label class="field-label">Visibility</label>
          <div style="display: flex; gap: 15px; margin-top: 5px;">
            <label style="display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">
              <input type="radio" name="upload-visibility" value="public" checked /> Public
            </label>
            <label style="display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">
              <input type="radio" name="upload-visibility" value="private" /> Private
            </label>
          </div>
        </div>

        <button type="submit" class="cta--button" id="upload-submit-btn">Upload File</button>
        <p id="upload-status" class="auth-message" style="margin-top: 10px;"></p>
      </form>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-text">Software Engineering Project — internal team record</p>
  </div>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
